name: Release

# Pathfinder desktop artifacts are built and privacy-checked before upload.
# Verify published assets without invoking the inherited Reasonix CLI publisher.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify (empty selects latest)
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify Pathfinder desktop release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download release assets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_TAG" ]]; then
            RELEASE_TAG="$(gh release view --json tagName --jq .tagName)"
          fi
          echo "RELEASE_TAG=$RELEASE_TAG" >> "$GITHUB_ENV"
          mkdir -p dist
          gh release download "$RELEASE_TAG" --pattern "Pathfinder-UCD-${RELEASE_TAG}-macOS-arm64.dmg" --dir dist
          gh release download "$RELEASE_TAG" --pattern PRIVACY-AND-BUILD.json --dir dist
          gh release download "$RELEASE_TAG" --pattern SHA256SUMS.txt --dir dist
      - name: Verify checksums and release report
        shell: bash
        run: |
          set -euo pipefail
          shasum -a 256 -c dist/SHA256SUMS.txt
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          report = json.loads(Path("dist/PRIVACY-AND-BUILD.json").read_text())
          assert report["version"] == os.environ["RELEASE_TAG"].removeprefix("v")
          expected = {"changemajor.db", "courses.db", "majors.db", "rmp.db", "ucdavis_calendar.db"}
          assert {item["file"] for item in report["bundled_databases"]} == expected
          assert "users.db" in report["excluded"] and "app.db" in report["excluded"]
          print("Release checksums and declared database allowlist verified.")
          PYTHON
      - name: Summarize verification
        shell: bash
        run: |
          echo "Pathfinder UCD $RELEASE_TAG: published asset checksums and privacy report verified." >> "$GITHUB_STEP_SUMMARY"
          echo "This check does not rebuild or independently inspect the packaged databases." >> "$GITHUB_STEP_SUMMARY"
