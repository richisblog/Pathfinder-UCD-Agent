<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pathfinder Schedule Bridge</title>
  </head>
  <body>
    <main>
      <p class="eyebrow">PATHFINDER UCD</p>
      <h1>实时课程桥</h1>
      <p id="status" class="status">正在连接本机 Pathfinder…</p>
      <form id="pair-form" hidden>
        <label for="pair-code">输入 Pathfinder 中显示的 6 位配对码</label>
        <input id="pair-code" name="pair-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" required />
        <button type="submit">连接 Pathfinder</button>
      </form>
      <button id="retry" type="button">重新检测</button>
      <p class="privacy">只读查询。密码、Cookie 和 CSRF Token 不会发送给 Pathfinder。</p>
    </main>
    <script type="module" src="/src/popup/popup.ts"></script>
  </body>
</html>
